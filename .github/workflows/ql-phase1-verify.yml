name: QL Phase 1 Verify
on:
  push:
    branches: [ql/phase-1-relationships]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node ql/verify-phase1.cjs
