name: QL Phase 1 + Phase 2 Verify
on:
  push:
    branches: [ql/phase-1-relationships, ql/phase-2a-piece-history, ql/phase-2b-piece-history-web, ql/phase-2c-history-validation, ql/phase-2d-piece-media]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node ql/verify-phase1.cjs
      - name: Phase 1 strict closure gate
        run: QL_READINESS_STRICT=1 node --test tests/ql-readiness-blockers.cjs tests/ql-safety-migrations.cjs
