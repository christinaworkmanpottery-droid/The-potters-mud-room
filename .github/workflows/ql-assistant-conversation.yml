name: QL Phase 4I conversation verification
on:
  push:
    branches: [ql/studio-note-recovery-gpt, ql/studio-note-recovery, ql/phase-4i-conversation-context, ql/phase-4i-device-repair, ql/phase-4i-speech-clarification, ql/phase-4i-piece-clarification, ql/phase-4i-joined-speech, ql/phase-4j-confirmed-studio-notes, ql/phase-4j-note-dialogue, ql/phase-4j-dictation-repair, ql/phase-4k-voice-reliability, ql/phase-4l-flexible-commands, ql/phase-4l-saved-note-followup, ql/clayton-hands-free-engine]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Assistant, voice, actual HTTP and canonical search regressions
        run: node --require ./ql/rehearsal/suite-isolate.cjs --test tests/ql-assistant*.cjs tests/ql-studio-search.cjs tests/ql-studio-search-dom.cjs tests/ql-studio-search-http.cjs
      - name: Strict foundation gate
        run: QL_READINESS_STRICT=1 node --require ./ql/rehearsal/suite-isolate.cjs --test tests/ql-readiness-blockers.cjs tests/ql-safety-migrations.cjs
